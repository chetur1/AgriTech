# ============================================================
# AGRI SMART — Alembic Configuration
# File: backend/alembic.ini
#
# Alembic manages database schema migrations.
# Run migrations with: alembic upgrade head
# Create a new migration: alembic revision --autogenerate -m "description"
# ============================================================

[alembic]
# Path to migration scripts
script_location = alembic

# Template for new migration filenames
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# SQLAlchemy database URL — overridden by env.py reading from app settings
sqlalchemy.url = postgresql://agrismart_user:changeme@localhost:5432/agrismart_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
