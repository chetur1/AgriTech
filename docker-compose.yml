version: '3.8'

# ============================================================
# AGRI SMART — Full-Stack Production Docker Compose
# Services:
#   - frontend: React 18 + Vite PWA on Nginx
#   - backend: FastAPI (Python 3.11) + Uvicorn
#   - postgres: PostgreSQL 16 (Production Relational DB)
#   - redis: In-memory cache for weather & rate limits
# ============================================================

services:
  # ----------------------------------------------------------
  # 1. Database: PostgreSQL 16
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: agrismart_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrismart_db}
      POSTGRES_USER: ${POSTGRES_USER:-agrismart_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AgriSmartSecurePassword2026!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrismart_user -d agrismart_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agrismart_network

  # ----------------------------------------------------------
  # 2. In-Memory Cache: Redis 7
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: agrismart_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agrismart_network

  # ----------------------------------------------------------
  # 3. Application API: FastAPI Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agrismart_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agrismart_user}:${POSTGRES_PASSWORD:-AgriSmartSecurePassword2026!}@postgres:5432/${POSTGRES_DB:-agrismart_db}
      SECRET_KEY: ${SECRET_KEY:-b9318b76c8c4a56a64f526315efcfcf5a13c9e6d987df57cf2436d40026e6f1a}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    networks:
      - agrismart_network

  # ----------------------------------------------------------
  # 4. Web Application: React + Vite PWA on Nginx
  # ----------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agrismart_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - agrismart_network

# ------------------------------------------------------------
# Persistent Volumes & Network Definitions
# ------------------------------------------------------------
volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local
  redis_data:
    driver: local

networks:
  agrismart_network:
    driver: bridge
